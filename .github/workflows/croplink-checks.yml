name: CropLink integrity checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check unified app structure and syntax
        run: node --experimental-vm-modules tests/smoke.mjs
